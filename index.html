<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Due">
<title>Due</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<!-- Self-hosted (see the banner in the file for version/provenance): a CDN <script>
     is a no-cors request, so its opaque response could never be cached by the service
     worker and a true offline cold start died before createClient. Same-origin, it's
     precached with the rest of the shell. -->
<script src="supabase.js"></script>
<style>
  /* ---------- theme: make camp (On My Way design system, always dark) ---------- */
  :root{
    --bg:#131722; --bg-deep:#10131c; --sheet:#1f2432; --sheet-raised:#262c3d;
    --line:#262c3d; --line-strong:#363d52; --chip-bg:#2a3040;
    --text:#e3ddcf; --muted:#8d94ad; --faint:#7d8299;
    --accent:#e8a94f; --accent-soft:#3a2f1c; --on-accent:#131722;
    --warn:#f7768e; --ember:rgba(232,169,79,.45);
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
  .serif{font-family:Georgia,'Times New Roman',serif}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- layout ---------- */
  .wrap{max-width:560px;margin:0 auto;padding:max(calc(env(safe-area-inset-top) + 30px), 64px) 20px 100px}
  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  h1{font-size:1.35rem;font-weight:400;font-style:italic;letter-spacing:3px;color:var(--accent)}
  .tbtn{color:var(--faint);font-size:.8rem;padding:4px 0}
  .tbtn:hover{color:var(--text)}
  .addbtn{border:1px solid var(--line-strong);background:var(--sheet);border-radius:8px;padding:8px 14px;font-size:.85rem;color:var(--text)}
  .addbtn:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- hero ---------- */
  .hero{margin:20px 0 4px}
  .total{font-size:1.8rem;font-weight:400;color:var(--accent)}
  .total .per{font-size:.75rem;color:var(--muted);font-weight:400;letter-spacing:1px;text-transform:uppercase;margin-left:4px}
  .total .dec{font-size:.55em;opacity:.75}
  .duesoon{font-size:.8rem;color:var(--muted);margin-top:5px;font-style:italic}
  .duesoon.warn{color:var(--accent)}
  .offbar{display:none;background:var(--accent);color:var(--on-accent);font-size:.78rem;padding:9px 14px;border-radius:8px;margin-top:14px;text-align:center}
  .offbar.err{background:var(--warn)}
  body.off .fab, body.off .addbtn, body.off .paybtn{opacity:.3;pointer-events:none}

  /* ---------- view toggle, tabs, filters ---------- */
  .viewbar{display:flex;justify-content:flex-end;margin-top:14px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);background:var(--sheet);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 14px;font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:2px}
  .seg button.on{background:var(--accent-soft);color:var(--accent)}
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:4px}
  .tab{padding:0 0 9px;font-size:.72rem;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:2px}
  .tab.on{color:var(--accent);border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--chip-bg);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:.76rem}
  .chip.on{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}

  /* ---------- search ---------- */
  .searchwrap{position:relative;margin:10px 0 2px}
  .searchwrap input{width:100%;padding:9px 38px 9px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:.9rem;background:var(--sheet);color:var(--text);font-family:inherit}
  .searchwrap input::placeholder{color:var(--faint);font-style:italic}
  .searchwrap input:focus{outline:none;border-color:var(--accent)}
  .searchwrap input::-webkit-search-cancel-button,.searchwrap input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
  .searchwrap .qclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:1rem;padding:6px 10px;display:none}
  .searchwrap .qclear:hover{color:var(--text)}
  .searchwrap.hasq .qclear{display:block}

  /* ---------- list ---------- */
  .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  #list .item:first-child{border-top:none}
  .item .info{flex:1;min-width:0;cursor:pointer}
  .item .name{font-size:.95rem}
  .item .meta{color:var(--muted);font-size:.75rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
  .item .right{text-align:right}
  .item .amt{font-size:.95rem}
  .amt .dec{font-size:.75em;color:var(--muted)}
  .due{font-size:.75rem;color:var(--faint);margin-top:2px}
  .due.hot{color:var(--warn)}
  .due.near{color:var(--text)}
  .item.inactive{opacity:.45}
  .paybtn{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--accent);border-radius:50%;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1rem}
  .paybtn:active{background:var(--accent);color:var(--on-accent)}
  .empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:.88rem;font-style:italic}
  .fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center}

  /* ---------- undo toast ---------- */
  .undobar{position:fixed;left:50%;transform:translate(-50%,calc(100% + 30px));bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:15;
    display:flex;align-items:center;gap:16px;background:var(--sheet-raised);border:1px solid var(--line-strong);border-left:3px solid var(--accent);
    border-radius:10px;padding:11px 16px;font-size:.85rem;max-width:min(92vw,480px);box-shadow:0 6px 24px rgba(0,0,0,.45);
    transition:transform .25s ease,opacity .25s ease;white-space:nowrap;opacity:0;pointer-events:none}
  .undobar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .undobar .txt{overflow:hidden;text-overflow:ellipsis;font-style:italic;color:var(--muted)}
  .undobar .txt b{color:var(--text);font-weight:400;font-style:normal}
  .undobar button{color:var(--accent);font-size:.78rem;text-transform:uppercase;letter-spacing:2px;flex:0 0 auto}
  @media (max-width:640px){.undobar{bottom:calc(env(safe-area-inset-bottom) + 86px)}}
  @media (prefers-reduced-motion:reduce){.undobar{transition:none}}

  /* ---------- recently deleted ---------- */
  .trashnote{font-size:.78rem;color:var(--faint);font-style:italic;margin-top:12px}

  /* ---------- ember glow (the one celebration: fades off a just-paid row) ---------- */
  @keyframes ember{0%{box-shadow:0 0 16px 3px var(--ember)}100%{box-shadow:0 0 18px 4px rgba(232,169,79,0)}}
  .item.ember{animation:ember 1s ease-out;border-radius:10px}
  @media (prefers-reduced-motion:reduce){.item.ember{animation:none}}

  /* ---------- responsive ---------- */
  @media (min-width:641px){.fab{display:none}}
  @media (max-width:640px){
    .addbtn{display:none}
    .wrap{padding-left:16px;padding-right:16px;padding-bottom:92px}
    h1{font-size:1.15rem}
    .hero{margin:16px 0 2px}
    .total{font-size:1.45rem}
    .duesoon{font-size:.74rem}
    .item{padding:11px 0}
  }

  /* ---------- auth ---------- */
  .auth{max-width:360px;margin:0 auto;padding:max(calc(env(safe-area-inset-top) + 14vh), 16vh) 20px 0;text-align:center}
  .auth h1{font-size:1.5rem;margin-bottom:8px}
  .auth p{color:var(--muted);font-size:.85rem;margin-bottom:24px;font-style:italic}
  .auth input{width:100%;padding:13px 14px;border:1px solid var(--line-strong);border-radius:10px;font-size:1rem;margin-bottom:12px;background:var(--sheet);color:var(--text)}
  .auth input::placeholder{color:var(--faint)}
  .auth input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;background:var(--accent);color:var(--on-accent);padding:13px;border-radius:8px;font-weight:700;font-size:.95rem}
  .btn:disabled{opacity:.5}
  .ghost{display:block;width:100%;color:var(--muted);font-size:.8rem;padding:10px 0}
  .ghost:hover{color:var(--text)}
  .msg{font-size:.8rem;margin-top:10px;color:var(--muted);line-height:1.5}
  .msg.err{color:var(--warn)}

  /* ---------- ask sheet (replaces prompt/alert/confirm) ---------- */
  #askSheet{z-index:25}                       /* sits above the sheet that opened it */
  .askmsg{font-size:.86rem;color:var(--muted);margin:-6px 0 14px;line-height:1.5}
  .askbtns{display:flex;gap:10px;margin-top:6px}
  .askbtns .btn{flex:1}
  /* destructive confirm matches the outlined .danger button in the edit form,
     keeping red as an accent rather than a fill (per the design system) */
  .askbtns .btn.warn{background:none;border:1px solid var(--line-strong);color:var(--warn);font-weight:400}

  /* ---------- sheets (bottom overlays) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.open{display:flex}
  .sheet{background:var(--sheet-raised);width:100%;max-width:560px;border-radius:12px 12px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;border-top:1px solid var(--accent)}
  .sheet h2{font-size:1.1rem;font-weight:400;font-style:italic;margin-bottom:14px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:.7rem;color:var(--faint);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
  .field input,.field select,.field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:.9rem;background:var(--sheet);color:var(--text);font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field select option{background:var(--sheet)}
  input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left;min-height:41px}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}   /* bottom-align inputs even if one label wraps */
  .check{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:4px 0 12px}
  .check input{width:17px;height:17px;accent-color:var(--accent)}
  .actions{display:flex;gap:10px;margin-top:6px}
  .actions .btn{flex:1}
  .danger{border:1px solid var(--line-strong);color:var(--warn);padding:13px 16px;border-radius:8px;font-size:.9rem}
  .lastpaid{font-size:.78rem;color:var(--muted);margin:-2px 0 10px;font-style:italic}
  .formerr{font-size:.78rem;color:var(--warn);margin:2px 0 8px;display:none}

  /* ---------- accounts sheet ---------- */
  .acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .acct:first-child{border-top:none}
  .acct .nm{font-size:.9rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .nm.off{color:var(--muted)}
  .acct .nm .tag{font-size:.7rem;color:var(--muted);margin-left:6px}
  .acct .btns{display:flex;gap:14px;flex:0 0 auto}
  .acctadd{display:flex;gap:10px;margin:12px 0 4px}
  .acctadd input{flex:1;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;font-size:.9rem;background:var(--sheet);color:var(--text)}
  .acctadd input:focus{outline:none;border-color:var(--accent)}
  .acctadd button{border:1px solid var(--line-strong);border-radius:8px;padding:0 16px;font-size:.85rem}

  /* 16px inputs on mobile so iOS Safari doesn't auto-zoom on focus (must come
     after the .field/.acctadd/.searchwrap rules above or the cascade overrides it) */
  @media (max-width:640px){
    .field input,.field select,.field textarea,.acctadd input,.searchwrap input{font-size:16px}
  }

  /* ---------- footer ---------- */
  .foot{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 26px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div id="authView" class="auth" style="display:none">
  <h1 class="serif">Due</h1>
  <p>Sign in to see your subscriptions on any device.</p>
  <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="signInBtn" data-act="signIn">Sign in</button>
  <button class="ghost" data-act="signUp">New here? Create an account</button>
  <button class="ghost" data-act="sendLink">Forgot password? Email me a sign-in link</button>
  <div id="authMsg" class="msg"></div>
</div>

<div id="appView" class="wrap" style="display:none">
  <header>
    <h1>Due</h1>
    <button class="addbtn" data-act="addSub">+ Add</button>
  </header>

  <div class="hero">
    <div class="total serif" id="totMonthly">—</div>
    <div class="duesoon" id="dueLine"></div>
  </div>
  <div class="offbar" id="offbar"></div>

  <div class="viewbar">
    <div class="seg">
      <button id="segWeek" data-act="setView" data-view="week">Week</button>
      <button id="segMonth" data-act="setView" data-view="month">Month</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="searchwrap" id="searchWrap">
    <input id="q" type="search" placeholder="Search subscriptions…" autocomplete="off" data-input="search">
    <button class="qclear" aria-label="Clear search" data-act="clearQuery">✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>

  <div class="foot">
    <button class="tbtn" data-act="openAccts">Bank accounts</button>
    <button class="tbtn" id="trashBtn" data-act="openTrash">Recently deleted</button>
    <button class="tbtn" data-act="changePassword">Change password</button>
    <button class="tbtn" data-act="signOut">Sign out</button>
    <span class="tbtn" id="verLabel" style="cursor:default;opacity:.6"></span>
  </div>

  <button class="fab" data-act="addSub" aria-label="Add subscription">+</button>
</div>

<div class="overlay" id="formSheet" data-close="closeForm">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <h2 id="formTitle">Add subscription</h2>
    <div class="field"><label>Name *</label><input id="f_name" placeholder="Netflix, iCloud, gym…"></div>
    <div class="field"><label>Planned amount ($) *</label><input id="f_amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="15.99"></div>
    <div class="row2">
      <div class="field" id="cycNwrap"><label>Repeats every *</label><input id="f_cycn" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
      <div class="field"><label>&#8203;</label>
        <select id="f_cycu" data-change="cycleUnit">
          <option value="week">week(s)</option>
          <option value="month" selected>month(s)</option>
          <option value="once">one-time bill</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Next bill due *</label><input id="f_due" type="date"></div>
      <div class="field"><label>Paid with *</label><select id="f_method" data-change="pickAccount"></select></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="2" placeholder="Optional — shared with family, cancel before trial ends…"></textarea></div>
    <div class="lastpaid" id="f_lastpaid" style="display:none"></div>
    <div class="check"><input type="checkbox" id="f_active" checked><label for="f_active" style="margin:0;font-size:.85rem;color:var(--text)">Active</label></div>
    <div class="formerr" id="f_err"></div>
    <div class="actions">
      <button class="danger" id="deleteBtn" style="display:none" data-act="delItem">Delete</button>
      <button class="btn" id="saveBtn" data-act="saveItem">Save</button>
    </div>
    <button class="ghost" style="margin-top:8px" data-act="closeForm">Cancel</button>
  </div>
</div>

<div class="overlay" id="paySheet" data-close="closePay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="payTitle">
    <h2 id="payTitle">Mark paid</h2>
    <div class="row2">
      <div class="field"><label>Amount paid ($) *</label><input id="p_amount" type="number" step="0.01" min="0" inputmode="decimal"></div>
      <div class="field"><label>Payment date *</label><input id="p_date" type="date"></div>
    </div>
    <div class="formerr" id="p_err"></div>
    <button class="btn" id="payBtn" data-act="confirmPay">Record payment</button>
    <button class="ghost" style="margin-top:8px" data-act="closePay">Cancel</button>
  </div>
</div>

<div class="overlay" id="trashSheet" data-close="closeTrash">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="trashTitle">
    <h2 id="trashTitle">Recently deleted</h2>
    <div id="trashList"></div>
    <p class="trashnote">Deleted subscriptions stay here (with their payment history) until you restore them or delete them for good. “Delete forever” also erases their payment history.</p>
    <button class="ghost" style="margin-top:8px" data-act="closeTrash">Close</button>
  </div>
</div>

<div class="overlay" id="askSheet" data-close="askCancel">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle"></h2>
    <p class="askmsg" id="askMsg"></p>
    <div class="field" id="askField">
      <label id="askLabel" for="askInput"></label>
      <input id="askInput" autocomplete="off">
    </div>
    <div class="formerr" id="askErr"></div>
    <div class="askbtns">
      <button class="btn" id="askOk" data-act="askConfirm">Save</button>
    </div>
    <button class="ghost" id="askCancelBtn" style="margin-top:8px" data-act="askCancel">Cancel</button>
  </div>
</div>

<div class="undobar" id="undoBar">
  <span class="txt">Deleted <b id="undoName"></b></span>
  <button data-act="undoDelete">Undo</button>
</div>

<div class="overlay" id="acctSheet" data-close="closeAccts">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="acctTitle">
    <h2 id="acctTitle">Bank accounts</h2>
    <div id="acctList"></div>
    <div class="acctadd">
      <input id="newAcct" placeholder="e.g. Chase Visa •1234">
      <button data-act="addAcct">Add</button>
    </div>
    <div class="check" style="margin-top:10px">
      <input type="checkbox" id="showInactive" data-change="showInactive">
      <label for="showInactive" style="margin:0;font-size:.85rem;color:var(--muted)">Show inactive accounts</label>
    </div>
    <button class="ghost" style="margin-top:8px" data-act="closeAccts">Close</button>
  </div>
</div>

<script>
"use strict";

/* ================= constants & state ================= */
const APP_VERSION = "6.0";
const SUPABASE_URL = "https://anpvflizwcmyefbxsfpx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Va_eUdkFSmtD4uKqNIvppw_wlB1eEYJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "implicit", detectSessionInUrl: true } });

let items = [], deletedItems = [], accounts = [], lastPay = {};
let userId = null;   // who the localStorage cache belongs to — see saveCache()/useCache()
let editingId = null, payingId = null, justPaidId = null, offline = false;
let loadToken = 0;   // only the newest load() may write to state — see load()
let filter = "all", query = "";
let undoItem = null, undoTimer = null;
let view = localStorage.getItem("view") || "week";
let tab = "this";

/* ================= tiny helpers ================= */
const $ = id => document.getElementById(id);
const show = (id, on) => { $(id).style.display = on ? "block" : "none"; };
const sheetStack = [];      // innermost sheet last — Escape and the focus trap use this
const focusStack = [];
function openSheet(id){
  focusStack.push(document.activeElement);
  sheetStack.push(id);
  $(id).classList.add("open");
  const first = $(id).querySelector("input:not([type=hidden]):not([disabled]), select, textarea, button");
  if(first) setTimeout(() => first.focus(), 30);
}
function closeSheet(id){
  $(id).classList.remove("open");
  const i = sheetStack.lastIndexOf(id);
  if(i >= 0) sheetStack.splice(i, 1);
  const back = focusStack.pop();
  if(back && document.contains(back)) back.focus();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => { const [i,d] = Number(n).toFixed(2).split("."); return "$" + Number(i).toLocaleString("en-US") + '<span class="dec">.' + d + '</span>'; };
const moneyText = n => "$" + Number(n).toFixed(2);
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const prettyDate = s => new Date(s+"T00:00:00").toLocaleDateString(undefined, { day:"numeric", month:"short" });
const daysUntil = s => s == null ? null : Math.round((new Date(s+"T00:00:00") - today()) / 86400000);

/* ================= accounts ================= */
const acctById = id => accounts.find(a => a.id === id);
// Subscriptions link to accounts by id. payment_method is the pre-v5.7 text copy of
// the name, still read as a fallback so a stale cache renders sensibly.
function acctName(it){
  const a = it.account_id ? acctById(it.account_id) : null;
  return a ? a.name : (it.payment_method || "");
}

/* ================= billing cycles ================= */
const LEGACY_CYCLES = { weekly:["week",1], biweekly:["week",2], fourweekly:["week",4], monthly:["month",1], quarterly:["month",3], yearly:["month",12], once:["once",null] };
function cyc(it){
  let unit = it.cycle_unit, n = it.cycle_count;
  if(!unit) [unit, n] = LEGACY_CYCLES[it.billing_cycle] || ["month", 1];
  return { unit, n: n || 1 };
}
function monthlyEquiv(it){
  if(!it.amount || !it.active) return 0;
  const a = Number(it.amount), { unit, n } = cyc(it);
  if(unit === "week") return a * 52 / (12 * n);
  if(unit === "month") return a / n;
  return 0;
}
const lastDayOf = (y, m) => new Date(y, m + 1, 0).getDate();   // day 0 of the next month
function addCycle(dateStr, it){
  const { unit, n } = cyc(it);
  if(unit === "once") return null;
  const d = new Date(dateStr + "T00:00:00");
  if(unit === "week"){ d.setDate(d.getDate() + 7*n); return iso(d); }
  // Months: setMonth() overflows (Jan 31 + 1mo => Mar 3), so clamp to the last day of
  // the target month instead. due_day remembers the day the user actually picked, so a
  // 31st bill lands on Feb 28 and then returns to Mar 31 rather than sticking at the 28th.
  const anchor = it.due_day || d.getDate();
  const y = d.getFullYear(), m = d.getMonth() + n;
  return iso(new Date(y, m, Math.min(anchor, lastDayOf(y, m))));
}
function cycleLabel(it){
  const { unit, n } = cyc(it);
  if(unit === "once") return "one-time";
  if(unit === "week") return n === 1 ? "weekly" : "every " + n + " wks";
  return n === 1 ? "monthly" : n === 3 ? "quarterly" : n === 12 ? "yearly" : "every " + n + " mo";
}
function periodEnds(){
  const t = today();
  if(view === "week"){
    const monday = new Date(t); monday.setDate(t.getDate() - (t.getDay()+6)%7);
    const e1 = new Date(monday); e1.setDate(monday.getDate()+7);
    const e2 = new Date(monday); e2.setDate(monday.getDate()+14);
    return { thisEnd:e1, nextEnd:e2 };
  }
  return { thisEnd: new Date(t.getFullYear(), t.getMonth()+1, 1), nextEnd: new Date(t.getFullYear(), t.getMonth()+2, 1) };
}

/* ================= auth ================= */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  userId = session?.user?.id || null;
  session ? showApp() : showAuth();
  sb.auth.onAuthStateChange((ev, sess) => {
    if(ev === "SIGNED_IN"){ userId = sess?.user?.id || userId; showApp(); }
    if(ev === "SIGNED_OUT"){
      // the cache is one signed-in person's data — never leave it behind for the
      // next account to see offline
      userId = null;
      try{ localStorage.removeItem("cache"); }catch(e){}
      showAuth();
    }
  });
}
function showAuth(){ show("appView", false); show("authView", true); }
async function showApp(){ show("authView", false); show("appView", true); await load(); }

function setMsg(t, err){ const m = $("authMsg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); }
async function signIn(){
  const email = $("email").value.trim(), password = $("password").value;
  if(!email || !password) return setMsg("Enter your email and password.", true);
  $("signInBtn").disabled = true; setMsg("Signing in…");
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("signInBtn").disabled = false;
  if(error) setMsg(error.message === "Invalid login credentials"
    ? "Wrong email or password. New here? Tap “Create an account” below."
    : error.message, true);
}
async function signUpNew(){
  const email = $("email").value.trim(), password = $("password").value;
  if(!email) return setMsg("Enter your email above first.", true);
  if(!password || password.length < 8) return setMsg("Choose a password of at least 8 characters, then tap Create an account.", true);
  setMsg("Creating account…");
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error) return setMsg(error.message, true);
  if(!data.session) setMsg("Almost done — check your email to confirm your account.");
}
async function sendLink(){
  const email = $("email").value.trim();
  if(!email) return setMsg("Enter your email above first.", true);
  setMsg("Sending…");
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true, emailRedirectTo: location.origin + location.pathname } });
  setMsg(error ? error.message : "Link sent to " + email + ". Open it on this device, then set a new password via “Change password”.", !!error);
}
async function changePassword(){
  const p = await promptText("Change password", {
    label: "New password", type: "password", ok: "Save password",
    validate: v => v.length < 8 ? "Use at least 8 characters." : null
  });
  if(p === null) return;
  const { error } = await sb.auth.updateUser({ password: p });
  note(error ? "Could not set password: " + error.message : "Password saved. Use it to sign in on any device.");
}
const signOut = () => sb.auth.signOut();

/* ================= ask sheet =================
   Replaces prompt/alert/confirm, which broke the visual language of the app and
   are especially jarring in an iOS standalone window. Returns a promise:
     cancel        -> null
     confirm-only  -> true
     with an input -> the entered string
   `validate` keeps the sheet open and shows the message inline, so a typo doesn't
   throw away what you typed. */
let askResolve = null, askOpts = {};
function ask(opts){
  askOpts = opts || {};
  $("askTitle").textContent = askOpts.title || "";
  $("askMsg").textContent = askOpts.message || "";
  show("askMsg", !!askOpts.message);
  show("askField", !!askOpts.input);
  if(askOpts.input){
    const el = $("askInput");
    el.type = askOpts.type || "text";
    el.value = askOpts.value || "";
    el.placeholder = askOpts.placeholder || "";
    $("askLabel").textContent = askOpts.label || "";
    show("askLabel", !!askOpts.label);
  }
  $("askOk").textContent = askOpts.ok || "OK";
  $("askOk").className = "btn" + (askOpts.danger ? " warn" : "");
  show("askCancelBtn", askOpts.cancel !== null);
  $("askCancelBtn").textContent = askOpts.cancel || "Cancel";
  $("askErr").style.display = "none";
  openSheet("askSheet");
  if(askOpts.input) setTimeout(() => { $("askInput").focus(); $("askInput").select(); }, 60);
  return new Promise(res => { askResolve = res; });
}
function askDone(v){
  closeSheet("askSheet");
  const r = askResolve; askResolve = null;
  if(r) r(v);
}
function askConfirm(){
  if(!askOpts.input) return askDone(true);
  const v = $("askInput").value;
  const bad = askOpts.validate ? askOpts.validate(v) : null;
  if(bad){ sheetError("askErr", bad); return; }
  askDone(v);
}
function askCancel(){ askDone(null); }

const note = (message, title) => ask({ title: title || "", message, ok: "OK", cancel: null });
const confirmAction = (title, message, ok, danger) =>
  ask({ title, message, ok: ok || "Confirm", danger, cancel: "Cancel" }).then(v => v === true);
const promptText = (title, opts) =>
  ask(Object.assign({ title, input: true, ok: "Save" }, opts));

/* ================= data, cache & offline ================= */
const OFFLINE_MSG = "You're offline — showing saved data. Changes are disabled until you're back online.";
function banner(msg, kind){
  $("offbar").textContent = msg || "";
  $("offbar").className = "offbar" + (kind ? " " + kind : "");
  show("offbar", !!msg);
}
function setOffline(v){
  offline = v;
  document.body.classList.toggle("off", v);
  banner(v ? OFFLINE_MSG : "", "");
}
// A query that comes back with an error is NOT the same as having no network — saying
// "you're offline" for an expired token or an RLS problem sends you to check the wifi.
function loadFailed(err){
  offline = false;
  document.body.classList.remove("off");
  const m = String(err.message || err);
  if(/JWT|token|session/i.test(m)){
    banner("Your session expired — please sign in again.", "err");
    return sb.auth.signOut();
  }
  banner("Couldn't refresh: " + m + " — showing saved data.", "err");
}
function saveCache(){ try{ localStorage.setItem("cache", JSON.stringify({ uid: userId, items, deletedItems, accounts, lastPay })); }catch(e){} }
function useCache(){
  try{
    const c = JSON.parse(localStorage.getItem("cache") || "null");
    // a cache stamped with someone else's uid is not this user's data — ignore it
    // (an older cache has no uid stamp; trust it once, saveCache re-stamps it)
    if(c && (!c.uid || c.uid === userId)){ items = c.items || []; deletedItems = c.deletedItems || []; accounts = c.accounts || []; lastPay = c.lastPay || {}; }
  }catch(e){}
  render();
}
window.addEventListener("online", () => { setOffline(false); load(); });
window.addEventListener("offline", () => setOffline(true));

async function load(){
  const token = ++loadToken;                       // several things can trigger a load at once
  const stale = () => token !== loadToken;         // a newer one started; drop this result
  if(!navigator.onLine){ setOffline(true); useCache(); return; }
  let s, a, p;
  try{
    [s, a, p] = await Promise.all([
      sb.from("subscriptions").select("*"),
      sb.from("accounts").select("*").order("name"),
      sb.from("last_payments").select("subscription_id, amount, paid_on")
    ]);
  }catch(e){ if(stale()) return; setOffline(true); useCache(); return; }   // no network at all
  if(stale()) return;
  if(s.error){ loadFailed(s.error); useCache(); return; }                  // the server answered, unhappily
  setOffline(false);
  const all = s.data || [];
  items = all.filter(i => !i.deleted_at);
  deletedItems = all.filter(i => i.deleted_at).sort((x,y) => x.deleted_at < y.deleted_at ? 1 : -1);
  if(!a.error) accounts = a.data || [];   // on error keep the last known list — never wipe it
  if(!p.error){
    lastPay = {};
    (p.data || []).forEach(r => { lastPay[r.subscription_id] = r; });   // the view returns one row per subscription
  }
  saveCache();
  render();
  refreshMethodSelect();   // the add/edit form may be open with a stale (empty) account dropdown
}
/* ================= render ================= */
function render(){
  renderHero();
  renderControls();
  renderList();
}
function renderHero(){
  let total = 0, dueSoon = 0, overdue = 0;
  items.forEach(it => {
    total += monthlyEquiv(it);
    const du = daysUntil(it.next_due);
    if(it.active && du !== null){
      if(du < 0) overdue++;
      else if(du <= 7) dueSoon++;
    }
  });
  $("totMonthly").innerHTML = total > 0 ? money(total) + '<span class="per">/ month</span>' : "—";
  const bits = [];
  if(overdue) bits.push(overdue + " overdue");
  if(dueSoon) bits.push(dueSoon + " due in the next 7 days");
  $("dueLine").textContent = bits.length ? bits.join(" · ") : "nothing due in the next 7 days";
  $("dueLine").className = "duesoon" + (bits.length ? " warn" : "");
}
function renderControls(){
  $("segWeek").className = view === "week" ? "on" : "";
  $("segMonth").className = view === "month" ? "on" : "";
  $("searchWrap").style.display = tab === "all" ? "" : "none";   // search lives on the All tab only
  const unit = view === "week" ? "week" : "month";
  $("tabs").innerHTML = [["this", "This " + unit], ["next", "Next " + unit], ["all", "All"]]
    .map(([t, label]) => '<button class="tab' + (tab === t ? " on" : "") + '" data-act="setTab" data-tab="' + t + '">' + label + '</button>')
    .join("");

  const used = [...new Set(items.map(i => i.account_id).filter(Boolean))]
    .map(acctById).filter(Boolean)
    .sort((x,y) => x.name.localeCompare(y.name));
  $("chips").innerHTML = used.length
    ? ['<button class="chip' + (filter === "all" ? " on" : "") + '" data-act="setFilter" data-acct="all">All accounts</button>']
      .concat(used.map(a => '<button class="chip' + (filter === a.id ? " on" : "") + '" data-act="setFilter" data-acct="' + esc(a.id) + '">' + esc(a.name) + '</button>'))
      .join("")
    : "";
}
function matchesQuery(i){
  const q = query.trim().toLowerCase();
  if(!q) return true;
  return [i.name, i.notes, acctName(i), cycleLabel(i)].some(f => f && String(f).toLowerCase().includes(q));
}
// active first, then soonest due; undated rows sink to the bottom
function byDue(a, b){
  if(a.active !== b.active) return a.active ? -1 : 1;
  const da = a.next_due || "9999", db = b.next_due || "9999";
  return da < db ? -1 : da > db ? 1 : 0;
}
function visibleItems(){
  const { thisEnd, nextEnd } = periodEnds();
  // searching looks through EVERYTHING (all tabs, all accounts) so nothing hides
  if(query.trim()) return items.filter(matchesQuery).sort(byDue);
  return items
    .filter(i => filter === "all" || i.account_id === filter)
    .filter(i => {
      if(tab === "all") return true;
      if(!i.active || !i.next_due) return false;
      const d = new Date(i.next_due + "T00:00:00");
      return tab === "this" ? d < thisEnd : (d >= thisEnd && d < nextEnd);
    })
    .sort(byDue);
}
function dueLabel(it){
  if(!it.active) return '<div class="due">paused</div>';
  const du = daysUntil(it.next_due);
  if(du === null) return "";
  if(du < 0)  return '<div class="due hot">overdue ' + (-du) + 'd</div>';
  if(du === 0) return '<div class="due hot">due today</div>';
  if(du <= 7) return '<div class="due near">in ' + du + ' day' + (du > 1 ? "s" : "") + '</div>';
  return '<div class="due">' + prettyDate(it.next_due) + '</div>';
}
function renderList(){
  const glowId = justPaidId; justPaidId = null;   // one-shot: glow only on the render right after a payment
  const shown = visibleItems();
  const unit = view === "week" ? "week" : "month";
  if(!shown.length){
    const txt = query.trim() ? "No matches for “" + esc(query.trim()) + "”."
      : tab === "this" ? "Nothing due or overdue this " + unit + "."
      : tab === "next" ? "Nothing due next " + unit + "."
      : "No subscriptions yet.<br>Tap + to add your first one.";
    $("list").innerHTML = '<div class="empty">' + txt + '</div>';
    return;
  }
  $("list").innerHTML = shown.map(it => {
    const canPay = it.active && it.next_due;
    return '<div class="item' + (it.active ? "" : " inactive") + (it.id === glowId ? " ember" : "") + '">'
      + '<div class="info" data-act="editSub" data-id="' + esc(it.id) + '">'
      +   '<div class="name">' + esc(it.name) + '</div>'
      +   '<div class="meta">' + esc(acctName(it) || "no account set") + ' · ' + cycleLabel(it) + (it.notes ? ' · ' + esc(it.notes) : '') + '</div>'
      + '</div>'
      + '<div class="right">'
      +   (it.amount ? '<div class="amt">' + money(it.amount) + '</div>' : '')
      +   dueLabel(it)
      + '</div>'
      + (canPay ? '<button class="paybtn" aria-label="Mark ' + esc(it.name) + ' paid" title="Mark paid" data-act="paySub" data-id="' + esc(it.id) + '">✓</button>' : '')
      + '</div>';
  }).join("");
}
function setFilter(f){ filter = f; render(); }
function setQuery(v){ query = v; $("searchWrap").classList.toggle("hasq", !!v.trim()); renderList(); }
function clearQuery(){ $("q").value = ""; setQuery(""); }
function setView(v){ view = v; try{ localStorage.setItem("view", v); }catch(e){} render(); }
function setTab(t){
  tab = t;
  if(t !== "all" && query){ query = ""; $("q").value = ""; $("searchWrap").classList.remove("hasq"); }  // leaving All clears the search
  render();
}

/* ================= subscription form ================= */
function methodOptions(currentId){
  const opts = ['<option value="">Select an account…</option>'];
  accounts.forEach(a => {
    if(a.active || a.id === currentId)
      opts.push('<option value="' + a.id + '"' + (a.id === currentId ? " selected" : "") + '>' + esc(a.name) + (a.active ? "" : " (inactive)") + '</option>');
  });
  // the linked account hasn't loaded yet — keep the selection rather than silently dropping it
  if(currentId && !acctById(currentId))
    opts.push('<option value="' + esc(currentId) + '" selected>…</option>');
  opts.push('<option value="__new">+ New account…</option>');
  return opts.join("");
}
function refreshMethodSelect(){   // re-fill the "Paid with" dropdown if the form is open (accounts may have arrived after it opened)
  if(!$("formSheet").classList.contains("open")) return;
  const sel = $("f_method"), cur = sel.value;
  if(cur === "__new") return;   // mid "new account" prompt — leave it alone
  sel.innerHTML = methodOptions(cur || "");
}
function cycleUnitChanged(){
  $("cycNwrap").style.visibility = $("f_cycu").value === "once" ? "hidden" : "visible";
}
function openForm(id){
  if(offline) return;
  editingId = id || null;
  const it = id ? items.find(x => x.id === id) : null;
  $("formTitle").textContent = it ? "Edit subscription" : "Add subscription";
  $("f_name").value = it?.name || "";
  $("f_amount").value = it?.amount ?? "";
  const c = it ? cyc(it) : { unit:"month", n:1 };
  $("f_cycu").value = c.unit;
  $("f_cycn").value = c.n;
  cycleUnitChanged();
  $("f_due").value = it?.next_due || "";
  $("f_method").innerHTML = methodOptions(it?.account_id || "");
  if(!accounts.length && navigator.onLine) load();   // dropdown opened empty — fetch accounts; refreshMethodSelect fills it in
  $("f_notes").value = it?.notes || "";
  $("f_active").checked = it ? it.active : true;
  const lp = it && lastPay[it.id];
  show("f_lastpaid", !!lp);
  if(lp) $("f_lastpaid").textContent = "Last paid: " + (lp.amount != null ? moneyText(lp.amount) : "—") + " on " + prettyDate(lp.paid_on);
  $("f_err").style.display = "none";
  show("deleteBtn", !!it);
  openSheet("formSheet");
}
const nameTaken = (n, exceptId) =>
  accounts.some(a => a.id !== exceptId && a.name.toLowerCase() === n.trim().toLowerCase());

async function onNewAccountOption(el){
  if(el.value !== "__new") return;
  const n = await promptText("New account", {
    label: "Bank account or card name", placeholder: "e.g. Chase Visa •1234", ok: "Add account",
    validate: v => !v.trim() ? "Enter a name." : nameTaken(v) ? "That account already exists." : null
  });
  if(n === null){ el.value = ""; return; }
  const { data, error } = await sb.from("accounts").insert({ name: n.trim() }).select().single();
  if(error){ await note("Could not add: " + error.message); el.value = ""; return; }
  accounts.push(data); accounts.sort((x,y) => x.name.localeCompare(y.name));
  $("f_method").innerHTML = methodOptions(data.id);
}
function closeForm(){ closeSheet("formSheet"); }
// shared by both sheets — one place that knows how an inline error is shown
function sheetError(id, t){ const el = $(id); el.textContent = t; el.style.display = "block"; }
const formError = t => sheetError("f_err", t);
const payError = t => sheetError("p_err", t);
async function saveItem(){
  const name = $("f_name").value.trim();
  const amount = $("f_amount").value;
  const unit = $("f_cycu").value;
  const n = parseInt($("f_cycn").value, 10);
  const due = $("f_due").value;
  const accountId = $("f_method").value;
  if(!name) return formError("Name is required.");
  if(amount === "" || isNaN(Number(amount)) || Number(amount) < 0) return formError("Planned amount is required.");
  if(unit !== "once" && (!n || n < 1)) return formError("Enter how often it repeats (1 or more).");
  if(!due) return formError("Next bill due date is required.");
  if(!accountId || accountId === "__new") return formError("Select the account it's paid with.");
  $("saveBtn").disabled = true;
  // due_day anchors monthly cycles — see addCycle(). Re-derive it only when the user
  // actually picked a new date: the form shows next_due, which may be sitting on a
  // clamped day (a 31st bill reads Feb 28 all February), so recomputing it on an
  // unrelated edit would silently overwrite the real anchor and stick the bill there.
  const prev = editingId ? items.find(x => x.id === editingId) : null;
  const dueDay = (prev && prev.next_due === due && prev.due_day) ? prev.due_day : Number(due.slice(8, 10));
  const rec = {
    name,
    amount: Number(amount),
    currency: "USD",
    cycle_unit: unit,
    cycle_count: unit === "once" ? null : n,
    next_due: due,
    due_day: dueDay,
    account_id: accountId,
    notes: $("f_notes").value.trim() || null,
    active: $("f_active").checked
  };
  const q = editingId
    ? sb.from("subscriptions").update(rec).eq("id", editingId)
    : sb.from("subscriptions").insert(rec);
  const { error } = await q;
  $("saveBtn").disabled = false;
  if(error) return formError("Save failed: " + error.message);
  closeForm(); await load();
}
async function delItem(){
  if(!editingId) return;
  const it = items.find(x => x.id === editingId);
  const ok = await confirmAction("Delete " + (it ? "“" + it.name + "”" : "this subscription") + "?",
    "You can restore it any time from “Recently deleted”.", "Delete", true);
  if(!ok) return;
  const { error } = await sb.from("subscriptions").update({ deleted_at: new Date().toISOString() }).eq("id", editingId);
  if(error) return note("Delete failed: " + error.message);
  closeForm(); await load();
  if(it) showUndo(it);
}

/* ================= undo & recently deleted ================= */
function showUndo(it){
  undoItem = it;
  $("undoName").textContent = it.name;
  $("undoBar").classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, 8000);
}
function hideUndo(){ $("undoBar").classList.remove("show"); undoItem = null; }
async function undoDelete(){
  if(!undoItem) return;
  const id = undoItem.id;
  hideUndo();
  const { error } = await sb.from("subscriptions").update({ deleted_at: null }).eq("id", id);
  if(error) return note("Could not undo: " + error.message);
  await load();
}
function openTrash(){
  if(offline) return note("You're offline — restoring needs a connection.");
  renderTrash();
  openSheet("trashSheet");
}
function closeTrash(){ closeSheet("trashSheet"); }
function renderTrash(){
  $("trashList").innerHTML = deletedItems.length
    ? deletedItems.map(it =>
        '<div class="acct">'
        + '<div class="nm">' + esc(it.name)
        +   '<span class="tag">' + (it.amount ? moneyText(it.amount) + " · " : "") + "deleted " + prettyDate(it.deleted_at.slice(0,10)) + '</span></div>'
        + '<div class="btns">'
        +   '<button class="tbtn" data-act="restoreItem" data-id="' + esc(it.id) + '">Restore</button>'
        +   '<button class="tbtn" style="color:var(--warn)" data-act="purgeItem" data-id="' + esc(it.id) + '">Delete forever</button>'
        + '</div></div>').join("")
    : '<div class="empty" style="padding:20px 0">Nothing here — you haven’t deleted any subscriptions.</div>';
}
async function restoreItem(id){
  const { error } = await sb.from("subscriptions").update({ deleted_at: null }).eq("id", id);
  if(error) return note("Could not restore: " + error.message);
  await load();
  renderTrash();
}
async function purgeItem(id){
  const it = deletedItems.find(x => x.id === id);
  const ok = await confirmAction("Delete “" + (it ? it.name : "this subscription") + "” forever?",
    "This also erases its payment history and cannot be undone.", "Delete forever", true);
  if(!ok) return;
  const { error } = await sb.from("subscriptions").delete().eq("id", id);
  if(error) return note("Could not delete: " + error.message);
  await load();
  renderTrash();
}

/* ================= mark paid ================= */
function openPay(id){
  if(offline) return;
  const it = items.find(x => x.id === id);
  if(!it) return;
  payingId = id;
  $("payTitle").textContent = "Mark paid — " + it.name;
  $("p_amount").value = it.amount ?? "";
  // due or overdue -> the due date is when it was probably paid; paying EARLY means
  // the money moved today — never default a payment to a date that hasn't happened
  const t = iso(today());
  $("p_date").value = (it.next_due && it.next_due <= t) ? it.next_due : t;
  $("p_err").style.display = "none";
  openSheet("paySheet");
}
function closePay(){ closeSheet("paySheet"); payingId = null; }
async function confirmPay(){
  const it = items.find(x => x.id === payingId);
  if(!it) return;
  const err = payError;
  const amt = $("p_amount").value, date = $("p_date").value;
  if(amt === "" || isNaN(Number(amt)) || Number(amt) < 0) return err("Enter the amount you actually paid.");
  if(!date) return err("Select the payment date.");
  $("payBtn").disabled = true;
  const once = cyc(it).unit === "once";
  let next = null;
  if(!once){
    next = addCycle(it.next_due, it);
    while(next && daysUntil(next) <= 0) next = addCycle(next, it);   // catch up if it's badly overdue
  }
  // one transaction: logging the payment and advancing the due date can't half-happen
  const { error } = await sb.rpc("record_payment", {
    p_subscription_id: payingId,
    p_amount: Number(amt),
    p_paid_on: date,
    p_next_due: next,
    p_deactivate: once
  });
  $("payBtn").disabled = false;
  if(error) return err("Could not record payment: " + error.message);
  justPaidId = payingId;
  closePay(); await load();
}

/* ================= bank accounts ================= */
function openAccts(){
  if(offline) return note("You're offline — account changes need a connection.");
  renderAccts();
  openSheet("acctSheet");
}
function closeAccts(){ closeSheet("acctSheet"); render(); }
function renderAccts(){
  const showAll = $("showInactive").checked;
  const list = accounts.filter(a => showAll || a.active);
  $("acctList").innerHTML = list.length
    ? list.map(a =>
        '<div class="acct">'
        + '<div class="nm' + (a.active ? "" : " off") + '">' + esc(a.name) + (a.active ? "" : '<span class="tag">inactive</span>') + '</div>'
        + '<div class="btns">'
        +   '<button class="tbtn" data-act="renameAcct" data-id="' + esc(a.id) + '">Rename</button>'
        +   '<button class="tbtn" data-act="toggleAcct" data-id="' + esc(a.id) + '" data-on="' + (!a.active) + '">' + (a.active ? "Deactivate" : "Reactivate") + '</button>'
        + '</div></div>').join("")
    : '<div class="empty" style="padding:20px 0">No accounts yet. Add your first one below.</div>';
}
async function addAcct(){
  const n = $("newAcct").value.trim();
  if(!n) return;
  if(nameTaken(n)) return note("That account already exists.");
  const { data, error } = await sb.from("accounts").insert({ name: n }).select().single();
  if(error) return note("Could not add: " + error.message);
  accounts.push(data); accounts.sort((x,y) => x.name.localeCompare(y.name));
  $("newAcct").value = "";
  renderAccts();
}
async function renameAcct(id){
  const a = accounts.find(x => x.id === id);
  if(!a) return;
  const n = await promptText("Rename account", {
    label: "Account name", value: a.name,
    validate: v => !v.trim() ? "Enter a name." : nameTaken(v, id) ? "That name is already used." : null
  });
  if(n === null) return;
  const name = n.trim();
  if(name === a.name) return;
  // subscriptions reference the account by id, so this is the only write needed
  const { error } = await sb.from("accounts").update({ name }).eq("id", id);
  if(error) return note("Could not rename: " + error.message);
  a.name = name;
  await load();
  renderAccts();
}
async function toggleAcct(id, active){
  const { error } = await sb.from("accounts").update({ active }).eq("id", id);
  if(error) return note("Could not update: " + error.message);
  const a = accounts.find(x => x.id === id);
  if(a) a.active = active;
  renderAccts();
}

/* ================= event wiring =================
   One listener per event type, dispatching on data-act / data-change / data-input.
   Handlers are looked up in these tables rather than interpolated into markup, so a
   forgotten esc() can no longer turn a subscription name into executable HTML. */
const ACTIONS = {
  signIn, signUp: signUpNew, sendLink, signOut, changePassword,
  addSub: () => openForm(),
  editSub: el => openForm(el.dataset.id),
  paySub: el => openPay(el.dataset.id),
  saveItem, delItem, closeForm, confirmPay, closePay,
  setView: el => setView(el.dataset.view),
  setTab: el => setTab(el.dataset.tab),
  setFilter: el => setFilter(el.dataset.acct),
  clearQuery,
  openAccts, closeAccts, addAcct,
  renameAcct: el => renameAcct(el.dataset.id),
  toggleAcct: el => toggleAcct(el.dataset.id, el.dataset.on === "true"),
  openTrash, closeTrash,
  askConfirm, askCancel,
  restoreItem: el => restoreItem(el.dataset.id),
  purgeItem: el => purgeItem(el.dataset.id),
  undoDelete
};
const CHANGES = {
  cycleUnit: cycleUnitChanged,
  pickAccount: onNewAccountOption,
  showInactive: renderAccts
};
const INPUTS = {
  search: el => setQuery(el.value)
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(el && ACTIONS[el.dataset.act]) return ACTIONS[el.dataset.act](el, e);
  // tapping the dimmed backdrop closes the sheet, but a click inside it must not
  if(e.target.classList.contains("overlay") && ACTIONS[e.target.dataset.close]) ACTIONS[e.target.dataset.close]();
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if(el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-input]");
  if(el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e);
});

// Keyboard: Escape closes the innermost sheet, Enter submits the ask sheet, and Tab
// stays inside the open sheet instead of wandering into the page behind it.
const focusablesIn = el => [...el.querySelectorAll('a[href], button:not([disabled]), input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled])')]
  .filter(x => x.offsetParent !== null);

document.addEventListener("keydown", e => {
  const top = sheetStack[sheetStack.length - 1];
  if(!top) return;
  if(e.key === "Escape"){
    const close = $(top).dataset.close;
    if(ACTIONS[close]){ e.preventDefault(); ACTIONS[close](); }
    return;
  }
  if(e.key === "Enter" && top === "askSheet" && e.target.id === "askInput"){
    e.preventDefault(); askConfirm(); return;
  }
  if(e.key === "Tab"){
    const f = focusablesIn($(top));
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ================= self-update ================= */
$("verLabel").textContent = "v" + APP_VERSION;   // the const is the only place the version is written

// Caches the shell so the app opens with no network at all. The worker is
// network-first for this page, so it can never pin you to an old build online.
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname + "?u=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = "([\d.]+)"/);
    if(!m || m[1] === APP_VERSION) return;
    if(sessionStorage.getItem("reloadedFor") === m[1]) return;
    sessionStorage.setItem("reloadedFor", m[1]);
    location.reload();
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") checkForUpdate(); });
checkForUpdate();

init();
</script>
