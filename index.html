<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1A16">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subscriptions">
<title>Subscriptions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231D9E75'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%231B1A16' font-family='Georgia'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Public+Sans:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1B1A16; --sheet:#232119; --line:#2B2924; --line2:#3A382F;
    --ink:#EDE9DF; --muted:#8F8A7C; --green:#1D9E75; --mint:#9FE1CB; --terra:#F0997B;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  .serif{font-family:'Fraunces',Georgia,serif}
  .wrap{max-width:560px;margin:0 auto;padding:max(calc(env(safe-area-inset-top) + 36px), 72px) 20px 110px}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  h1{font-family:'Fraunces',Georgia,serif;font-size:1.35rem;font-weight:500;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:.75rem;margin-top:4px}
  .hbtns{display:flex;align-items:center;gap:14px}
  .tbtn{color:var(--muted);font-size:.8rem;padding:4px 0}
  .tbtn:hover{color:var(--ink)}
  .addbtn{border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:.85rem;color:var(--ink)}
  .addbtn:hover{border-color:var(--muted)}

  .hero{margin:22px 0 6px}
  .total{font-size:1.9rem;font-weight:500;color:var(--mint)}
  .total .per{font-family:'Public Sans',sans-serif;font-size:.75rem;color:var(--muted);font-weight:400;margin-left:4px}
  .duesoon{font-size:.8rem;color:var(--muted);margin-top:6px}
  .duesoon.warn{color:var(--terra)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:.78rem}
  .chip.on{color:var(--ink);border-color:var(--muted)}

  .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
  #list .item:first-child{border-top:none}
  .item .info{flex:1;min-width:0;cursor:pointer}
  .item .name{font-size:.95rem}
  .item .meta{color:var(--muted);font-size:.75rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .right{text-align:right}
  .item .amt{font-family:'Fraunces',Georgia,serif;font-size:.95rem}
  .due{font-size:.75rem;color:var(--muted);margin-top:3px}
  .due.hot{color:var(--terra)}
  .due.near{color:var(--ink)}
  .item.inactive{opacity:.45}
  .paybtn{color:var(--green);font-size:.75rem;padding:4px 0 0;font-weight:500}
  .empty{text-align:center;color:var(--muted);padding:56px 16px;font-size:.9rem;border-top:1px solid var(--line);margin-top:14px}
  .foot{display:flex;justify-content:center;gap:28px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}

  .fab{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:54px;height:54px;border-radius:50%;background:var(--green);color:var(--bg);font-size:1.6rem;line-height:1;display:flex;align-items:center;justify-content:center}
  @media (min-width:641px){.fab{display:none}}
  @media (max-width:640px){.addbtn{display:none}}

  .auth{max-width:360px;margin:0 auto;padding:max(calc(env(safe-area-inset-top) + 14vh), 16vh) 20px 0;text-align:center}
  .auth h1{font-size:1.5rem;margin-bottom:8px}
  .auth p{color:var(--muted);font-size:.85rem;margin-bottom:24px}
  .auth input{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:10px;font-size:1rem;margin-bottom:12px;background:transparent;color:var(--ink)}
  .auth input::placeholder{color:var(--muted)}
  .auth input:focus{outline:none;border-color:var(--green)}
  .btn{width:100%;background:var(--green);color:var(--bg);padding:13px;border-radius:10px;font-weight:500;font-size:.95rem}
  .btn:disabled{opacity:.5}
  .ghost{display:block;width:100%;color:var(--muted);font-size:.8rem;padding:10px 0}
  .ghost:hover{color:var(--ink)}
  .msg{font-size:.8rem;margin-top:10px;color:var(--muted);line-height:1.5}
  .msg.err{color:var(--terra)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.open{display:flex}
  .sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;border-top:1px solid var(--line2)}
  .sheet h2{font-family:'Fraunces',Georgia,serif;font-size:1.05rem;font-weight:500;margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;font-size:.9rem;background:transparent;color:var(--ink);font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green)}
  .field select option{background:var(--sheet)}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .check{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:4px 0 14px}
  .check input{width:17px;height:17px;accent-color:var(--green)}
  .actions{display:flex;gap:10px;margin-top:8px}
  .actions .btn{flex:1}
  .danger{border:1px solid var(--line2);color:var(--terra);padding:13px 16px;border-radius:10px;font-size:.9rem}
</style>
</head>
<body>

<div id="authView" class="auth" style="display:none">
  <h1 class="serif">Subscriptions</h1>
  <p>Sign in to see your subscriptions on any device.</p>
  <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="signInBtn" onclick="signIn()">Sign in</button>
  <button class="ghost" onclick="signUpNew()">New here? Create an account</button>
  <button class="ghost" onclick="sendLink()">Forgot password? Email me a sign-in link</button>
  <div id="authMsg" class="msg"></div>
</div>

<div id="appView" class="wrap" style="display:none">
  <header>
    <div>
      <h1>Subscriptions</h1>
      <div class="sub" id="userEmail"></div>
    </div>
    <div class="hbtns">
      <button class="addbtn" onclick="openForm()">+ Add</button>
    </div>
  </header>

  <div class="hero">
    <div class="total serif" id="totMonthly">—</div>
    <div class="duesoon" id="dueLine"></div>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>

  <div class="foot">
    <button class="tbtn" onclick="changePassword()">Change password</button>
    <button class="tbtn" onclick="signOut()">Sign out</button>
  </div>

  <button class="fab" onclick="openForm()" aria-label="Add subscription">+</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <h2 id="formTitle">Add subscription</h2>
    <div class="field"><label>Name</label><input id="f_name" placeholder="Netflix, iCloud, gym…"></div>
    <div class="row2">
      <div class="field"><label>Amount</label><input id="f_amount" type="number" step="0.01" inputmode="decimal" placeholder="15.99"></div>
      <div class="field"><label>Currency</label>
        <select id="f_currency">
          <option>USD</option><option>SGD</option><option>MYR</option><option>EUR</option><option>GBP</option><option>AUD</option><option>JPY</option><option>KRW</option><option>HKD</option><option>THB</option><option>IDR</option><option>PHP</option><option>VND</option><option>INR</option><option>CAD</option><option>NZD</option><option>CNY</option><option>TWD</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Billing cycle</label>
        <select id="f_cycle">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
          <option value="quarterly">Quarterly</option>
          <option value="weekly">Weekly</option>
          <option value="once">One-time</option>
        </select>
      </div>
      <div class="field"><label>Next bill due</label><input id="f_due" type="date"></div>
    </div>
    <div class="field"><label>Paid with (bank account or card)</label>
      <input id="f_method" list="methods" placeholder="DBS Visa •1234">
      <datalist id="methods"></datalist>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="2" placeholder="Shared with family, cancel before trial ends…"></textarea></div>
    <div class="check"><input type="checkbox" id="f_active" checked><label for="f_active" style="margin:0;font-size:.85rem;color:var(--ink)">Active</label></div>
    <div class="actions">
      <button class="danger" id="deleteBtn" style="display:none" onclick="delItem()">Delete</button>
      <button class="btn" id="saveBtn" onclick="saveItem()">Save</button>
    </div>
    <button class="ghost" style="margin-top:10px" onclick="closeForm()">Cancel</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://anpvflizwcmyefbxsfpx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Va_eUdkFSmtD4uKqNIvppw_wlB1eEYJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "implicit", detectSessionInUrl: true } });

let items = [];
let editingId = null;
let filter = "all";

const $ = id => document.getElementById(id);
const fmt = (n,c) => (c||"") + " " + Number(n).toFixed(2);
const today = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? showApp(session) : showAuth();
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === "SIGNED_IN" && s) showApp(s);
    if (ev === "SIGNED_OUT") showAuth();
  });
}
function showAuth(){ $("appView").style.display="none"; $("authView").style.display="block"; }
async function showApp(session){
  $("authView").style.display="none"; $("appView").style.display="block";
  $("userEmail").textContent = session.user.email;
  await load();
}
async function signIn(){
  const email = $("email").value.trim(), password = $("password").value;
  if(!email || !password){ setMsg("Enter your email and password.", true); return; }
  $("signInBtn").disabled = true; setMsg("Signing in…");
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("signInBtn").disabled = false;
  if(error) setMsg(error.message === "Invalid login credentials"
    ? "Wrong email or password. New here? Tap “Create an account” below."
    : error.message, true);
}
async function signUpNew(){
  const email = $("email").value.trim(), password = $("password").value;
  if(!email){ setMsg("Enter your email above first.", true); return; }
  if(!password || password.length < 8){ setMsg("Choose a password of at least 8 characters, then tap Create an account.", true); return; }
  setMsg("Creating account…");
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ setMsg(error.message, true); return; }
  if(!data.session) setMsg("Almost done — check your email to confirm your account.");
}
async function sendLink(){
  const email = $("email").value.trim();
  if(!email){ setMsg("Enter your email above first.", true); return; }
  setMsg("Sending…");
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true, emailRedirectTo: location.origin + location.pathname } });
  if(error){ setMsg(error.message, true); return; }
  setMsg("Link sent to " + email + ". Open it on this device, then set a new password via the “Password” button.");
}
async function changePassword(){
  const p = prompt("New password (at least 8 characters):");
  if(p === null) return;
  if(p.length < 8){ alert("Password must be at least 8 characters."); return; }
  const { error } = await sb.auth.updateUser({ password: p });
  alert(error ? "Could not set password: " + error.message : "Password saved. Use it to sign in on any device.");
}
function setMsg(t, err){ const m=$("authMsg"); m.textContent=t; m.className="msg"+(err?" err":""); }
async function signOut(){ await sb.auth.signOut(); }

async function load(){
  const { data, error } = await sb.from("subscriptions").select("*");
  if(error){ alert("Could not load: "+error.message); return; }
  items = data || [];
  render();
}

function monthlyEquiv(it){
  if(!it.amount || !it.active) return 0;
  const a = Number(it.amount);
  return { monthly:a, yearly:a/12, quarterly:a/3, weekly:a*52/12, once:0 }[it.billing_cycle] ?? a;
}
function daysUntil(d){
  if(!d) return null;
  return Math.round((new Date(d+"T00:00:00") - today()) / 86400000);
}
function addCycle(dateStr, cycle){
  const d = new Date(dateStr+"T00:00:00");
  if(cycle==="weekly") d.setDate(d.getDate()+7);
  else if(cycle==="monthly") d.setMonth(d.getMonth()+1);
  else if(cycle==="quarterly") d.setMonth(d.getMonth()+3);
  else if(cycle==="yearly") d.setFullYear(d.getFullYear()+1);
  else return null;
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

function render(){
  const totals = {};
  let dueSoon = 0, overdue = 0;
  items.forEach(it=>{
    const m = monthlyEquiv(it);
    if(m>0) totals[it.currency||"?"] = (totals[it.currency||"?"]||0)+m;
    const du = daysUntil(it.next_due);
    if(it.active && du!==null){
      if(du<0) overdue++;
      else if(du<=7) dueSoon++;
    }
  });
  const tParts = Object.entries(totals).map(([c,v])=>fmt(v,c));
  $("totMonthly").innerHTML = tParts.length
    ? tParts.join(" + ") + '<span class="per">/ month</span>'
    : "—";
  const bits = [];
  if(overdue) bits.push(overdue + " overdue");
  if(dueSoon) bits.push(dueSoon + " due this week");
  $("dueLine").textContent = bits.length ? bits.join(" · ") : "nothing due this week";
  $("dueLine").className = "duesoon" + (bits.length ? " warn" : "");

  const methods = [...new Set(items.map(i=>i.payment_method).filter(Boolean))].sort();
  $("chips").innerHTML = methods.length
    ? ['<button class="chip'+(filter==="all"?" on":"")+'" onclick="setFilter(&quot;all&quot;)">All</button>']
      .concat(methods.map(m=>'<button class="chip'+(filter===m?" on":"")+'" data-m="'+esc(m)+'" onclick="setFilter(this.dataset.m)">'+esc(m)+'</button>'))
      .join("")
    : "";
  $("methods").innerHTML = methods.map(m=>'<option value="'+esc(m)+'">').join("");

  const shown = items.filter(i=>filter==="all"||i.payment_method===filter)
    .sort((a,b)=>{
      if(a.active!==b.active) return a.active?-1:1;
      const da=a.next_due||"9999", db=b.next_due||"9999";
      return da<db?-1:da>db?1:0;
    });

  if(!shown.length){
    $("list").innerHTML = '<div class="empty">No subscriptions yet.<br>Tap + to add your first one.</div>';
    return;
  }
  $("list").innerHTML = shown.map(it=>{
    const du = daysUntil(it.next_due);
    let due="";
    if(!it.active) due='<div class="due">paused</div>';
    else if(du===null) due="";
    else if(du<0) due='<div class="due hot">overdue '+(-du)+'d</div>';
    else if(du===0) due='<div class="due hot">due today</div>';
    else if(du<=7) due='<div class="due near">in '+du+' day'+(du>1?"s":"")+'</div>';
    else due='<div class="due">'+prettyDate(it.next_due)+'</div>';
    const canAdvance = it.active && it.next_due && du!==null && du<=0 && it.billing_cycle!=="once";
    return '<div class="item'+(it.active?"":" inactive")+'">'
      +'<div class="info" onclick="openForm(&quot;'+it.id+'&quot;)">'
        +'<div class="name">'+esc(it.name)+'</div>'
        +'<div class="meta">'+esc(it.payment_method||"no card set")+' · '+it.billing_cycle+(it.notes?' · '+esc(it.notes):'')+'</div>'
      +'</div>'
      +'<div class="right">'
        +(it.amount?'<div class="amt">'+fmt(it.amount,it.currency)+'</div>':'')
        +due
        +(canAdvance?'<button class="paybtn" onclick="markPaid(&quot;'+it.id+'&quot;)">mark paid ✓</button>':'')
      +'</div>'
    +'</div>';
  }).join("");
}
function setFilter(f){ filter=f; render(); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function prettyDate(d){ return new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

function openForm(id){
  editingId = id || null;
  const it = id ? items.find(x=>x.id===id) : null;
  $("formTitle").textContent = it ? "Edit subscription" : "Add subscription";
  $("f_name").value = it?.name || "";
  $("f_amount").value = it?.amount ?? "";
  $("f_currency").value = it?.currency || localStorage.getItem("lastCurrency") || "USD";
  $("f_cycle").value = it?.billing_cycle || "monthly";
  $("f_due").value = it?.next_due || "";
  $("f_method").value = it?.payment_method || "";
  $("f_notes").value = it?.notes || "";
  $("f_active").checked = it ? it.active : true;
  $("deleteBtn").style.display = it ? "block" : "none";
  $("overlay").classList.add("open");
}
function closeForm(){ $("overlay").classList.remove("open"); }
async function saveItem(){
  const name = $("f_name").value.trim();
  if(!name){ alert("Name is required"); return; }
  $("saveBtn").disabled = true;
  const rec = {
    name,
    amount: $("f_amount").value ? Number($("f_amount").value) : null,
    currency: $("f_currency").value,
    billing_cycle: $("f_cycle").value,
    next_due: $("f_due").value || null,
    payment_method: $("f_method").value.trim() || null,
    notes: $("f_notes").value.trim() || null,
    active: $("f_active").checked
  };
  try{ localStorage.setItem("lastCurrency", rec.currency); }catch(e){}
  const q = editingId
    ? sb.from("subscriptions").update(rec).eq("id", editingId)
    : sb.from("subscriptions").insert(rec);
  const { error } = await q;
  $("saveBtn").disabled = false;
  if(error){ alert("Save failed: "+error.message); return; }
  closeForm(); await load();
}
async function delItem(){
  if(!editingId || !confirm("Delete this subscription?")) return;
  const { error } = await sb.from("subscriptions").delete().eq("id", editingId);
  if(error){ alert("Delete failed: "+error.message); return; }
  closeForm(); await load();
}
async function markPaid(id){
  const it = items.find(x=>x.id===id);
  if(!it || !it.next_due) return;
  let next = it.next_due;
  do { next = addCycle(next, it.billing_cycle); } while(next && daysUntil(next) <= 0);
  if(!next) return;
  const { error } = await sb.from("subscriptions").update({ next_due: next }).eq("id", id);
  if(error){ alert("Update failed: "+error.message); return; }
  await load();
}

init();
</script>
</body>
</html>
